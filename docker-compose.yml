version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    ports:
      - '5450:5432'
    environment:
      POSTGRES_DB: diplomDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d diplomDB']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
